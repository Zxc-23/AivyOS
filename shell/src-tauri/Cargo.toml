[package]
name = "aivyos-shell"
version = "0.1.0"
description = "AivyOS 桌面壳层（Tauri 2.0）— §12-15 设计对齐"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# §12 桌面端能力（设计文档：托盘/热键/通知/自启/更新）
tauri-plugin-global-shortcut = "2"   # §12.3 全局热键
tauri-plugin-notification = "2"     # §12.6 / §15 原生通知
tauri-plugin-autostart = "2"        # §12.5 开机自启
tauri-plugin-updater = "2"          # §13 自动更新
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IPC 桥接：spawn Python 子进程 + TCP 回环客户端（§16.2 协议）
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
which = "6"

[lib]
name = "aivyos_shell_lib"
# 桌面端仅需 rlib（cdylib 用于移动端，mingw 下巨型 debug 导出序数溢出，
# 见 ld: export ordinal too large；移动端构建时再切换回 staticlib/cdylib/rlib）
crate-type = ["rlib"]
